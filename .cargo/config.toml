# Android cross-compile linker config for the agent native SDK (UniFFI cdylib).
# The NDK `toolchains/llvm/prebuilt/linux-x86_64/bin` directory must be on PATH
# when building, so cargo can locate these clang wrappers.
[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

# Cargo git dependencies (e.g. the codex fork) check out the entire repo, which
# includes files whose paths exceed Windows' 260-char MAX_PATH limit. Fetch with
# the git CLI so git-for-Windows' `core.longpaths` support can write them.
[net]
git-fetch-with-cli = true
