# Reverse proxy for the `aria-agent` cloud service (Docker Compose).
#
# nginx listens on :80 and forwards all traffic to the `cloud` service on the
# compose network. The host publishes ${NGINX_PORT}:80 (default 80). TLS is
# terminated upstream (outer LB), so this is plain HTTP.

upstream aria_cloud {
    server cloud:3000;
}

server {
    listen 80;
    server_name _;

    # Larger body size for agent payloads (tool results, file uploads).
    client_max_body_size 32m;

    # Lightweight health endpoint handled by nginx itself (no upstream needed).
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://aria_cloud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming endpoints (e.g. /v1/runs/stream) must not be buffered,
        # otherwise frames are held until the response completes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
