[package]
name = "aria-agent-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluggable sandbox abstraction for the agent platform. Docker (default), Kata, Cube providers."

[lib]
name = "agent_sandbox"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true

# Deep codex integration (ADR-0005 §Decision): tool execution is delegated to
# codex's real `SandboxManager` / `SandboxType` primitives instead of the
# self-contained CLI sandbox seam. Pulled as a git dependency from our codex
# fork (ariacompute/codex, branch `aria-root-workspace`), pinned to the commit
# that adds the repo-root workspace manifest so `workspace = true` inheritance
# (e.g. `anyhow`) resolves inside codex's own workspace. See
# docs/adr/0005-codex-integration.md.
codex-sandboxing = { git = "https://github.com/ariacompute/codex", tag = "root-workspace-v1", package = "codex-sandboxing" }

# Pin the entire `rama-*` family to the exact alpha.4 codex locks, otherwise
# cargo upgrades sibling crates to the released 0.3.0 and produces ~139 API
# errors (ADR-0005 §Blocker caveat).
rama-core = "=0.3.0-alpha.4"
rama-dns = "=0.3.0-alpha.4"
rama-error = "=0.3.0-alpha.4"
rama-http = "=0.3.0-alpha.4"
rama-http-backend = "=0.3.0-alpha.4"
rama-http-core = "=0.3.0-alpha.4"
rama-http-headers = "=0.3.0-alpha.4"
rama-http-types = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-net = "=0.3.0-alpha.4"
rama-socks5 = "=0.3.0-alpha.4"
rama-tcp = "=0.3.0-alpha.4"
rama-tls-rustls = "=0.3.0-alpha.4"
rama-udp = "=0.3.0-alpha.4"
rama-unix = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
