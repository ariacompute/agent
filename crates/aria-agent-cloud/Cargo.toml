[package]
name = "aria-agent-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
# This runtime crate is NOT published to crates.io: it ships as a GitHub Release
# binary instead. See `publish-cargo.yml`.
publish = false
description = "Agents Cloud API: axum + Postgres (pgvector context) + OpenAI beta Agents API."

[[bin]]
name = "aria-agent"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum = "0.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
async-stream = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
aria-agent-core = { workspace = true, features = ["openai"] }
# The A2A wire contract: card, JSON-RPC envelopes, task lifecycle, SSE frames.
aria-agent-a2a.workspace = true
aria-agent-dsh = { path = "../aria-agent-dsh" }
aria-agent-plugin.workspace = true
aria-agent-tools.workspace = true
aria-agent-orchestrator.workspace = true
# Recursive self-improvement: ledger, proposals, versioned playbooks (ADR-0026).
aria-agent-rsi.workspace = true
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# eMudhra/emSign CA key compromise (2026-10): webpki-roots 1.0.10+ removes the
# compromised emSign roots from the rustls trust store used by reqwest's rustls-tls.
webpki-roots = "1.0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
sha2 = "0.10"
rand = "0.8"
async-trait = "0.1"

# `agent-sandbox` is a direct dependency so we can select the Docker/Kata/Cube
# backend via `from_provider`.
aria-agent-sandbox.workspace = true
# The single governed egress boundary (egress policy, credential substitution,
# tool-output projection) — ADR-0021..0025.
aria-agent-governance = { path = "../aria-agent-governance" }
# Browser capability: provides `BrowserSandbox` (sandbox + engine) and
# `BrowserToolHandler`, injected by `build_agent` when `sandbox_provider=Browser`.
aria-agent-browser.workspace = true

[dev-dependencies]
# Drive the axum router in unit tests without binding a port (`oneshot`).
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
# Local HTTP stub for the upgrade download path (no real network in tests).
wiremock = "0.6"
tempfile = "3"
