[package]
name = "aria-agent-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agents Cloud API: axum + Postgres (metadata only) + OpenAI Agents API. Context comes from memo."

[[bin]]
name = "aria-agent"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum = "0.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
async-stream = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
aria-agent-core = { workspace = true, features = ["openai"] }
aria-agent-memo.workspace = true
aria-agent-reef.workspace = true
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
