[package]
name = "aria-agent-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
# This runtime crate is NOT published to crates.io: it depends on codex's
# git-only crates (which crates.io cannot resolve) and is shipped as a GitHub
# Release binary instead. See `publish-cargo.yml`.
publish = false
description = "Agents Cloud API: axum + Postgres (metadata only) + OpenAI Agents API. Context comes from memo."

[[bin]]
name = "aria-agent"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum = "0.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures = "0.3"
async-stream = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
aria-agent-core = { workspace = true, features = ["openai"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
sha2 = "0.10"
rand = "0.8"
async-trait = "0.1"

# `agent-sandbox` is a direct dependency so we can select the Docker/Kata/Cube
# backend via `from_provider`; the codex backend below is constructed in this
# (publish = false) runtime crate to keep the published SDK free of codex's
# unpublished git dependencies (crates.io requires every published dep to
# resolve from the registry). See `codex_sandbox::CodexSandbox` in `src/main.rs`.
aria-agent-sandbox.workspace = true

# Deep codex integration (ADR-0005 §Decision): tool execution is delegated to
# codex's real `SandboxManager` / `SandboxType` primitives. Pulled as a git
# dependency from our codex fork (ariacompute/codex, branch `main`).
# These crates are intentionally NOT in the published `aria-agent-sandbox`
# manifest — they are git-only and crates.io cannot resolve them.
codex-sandboxing = { git = "https://github.com/ariacompute/codex", branch = "main", package = "codex-sandboxing" }
codex-protocol = { git = "https://github.com/ariacompute/codex", branch = "main", package = "codex-protocol" }
codex-utils-absolute-path = { git = "https://github.com/ariacompute/codex", branch = "main", package = "codex-utils-absolute-path" }
codex-utils-path-uri = { git = "https://github.com/ariacompute/codex", branch = "main", package = "codex-utils-path-uri" }
codex-utils-pty = { git = "https://github.com/ariacompute/codex", branch = "main", package = "codex-utils-pty" }

# Pin the entire `rama-*` family to the exact alpha.4 codex locks, otherwise
# cargo upgrades sibling crates to the released 0.3.0 and produces ~139 API
# errors (ADR-0005 §Blocker caveat).
rama-core = "=0.3.0-alpha.4"
rama-dns = "=0.3.0-alpha.4"
rama-error = "=0.3.0-alpha.4"
rama-http = "=0.3.0-alpha.4"
rama-http-backend = "=0.3.0-alpha.4"
rama-http-core = "=0.3.0-alpha.4"
rama-http-headers = "=0.3.0-alpha.4"
rama-http-types = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-net = "=0.3.0-alpha.4"
rama-socks5 = "=0.3.0-alpha.4"
rama-tcp = "=0.3.0-alpha.4"
rama-tls-rustls = "=0.3.0-alpha.4"
rama-udp = "=0.3.0-alpha.4"
rama-unix = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

# Windows-only build fix for the codex dependency above: `codex-utils-pty`'s
# conpty code mixes `winapi::ctypes::c_void` with `std::ffi::c_void`, and the
# two are the same type **only** when winapi's `std` feature is on (winapi
# 0.3.9 defines its own `pub enum c_void {}` otherwise). Nothing else in our
# graph enables that feature, so a Windows build fails with three E0308s.
# Resolver v2 ignores features from platform-specific deps on other targets, so
# gating this to Windows leaves the Linux/macOS resolution untouched.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["std"] }
