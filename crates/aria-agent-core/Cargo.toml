[package]
name = "aria-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified agent runtime: wraps the codex harness loop, injects recalled context (ContextStore contract), isolates tools in a sandbox."

[lib]
name = "agent_core"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true
aria-agent-sandbox.workspace = true
futures = "0.3"
async-stream = "0.3"
async-openai = { version = "0.24", optional = true }

[features]
default = []
# Wire real OpenAI calls (Responses/Chat API) instead of the built-in stub model.
openai = ["dep:async-openai"]
