[package]
name = "ariacompute-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI cloud API client for the agent platform (Swift / Kotlin bindings)."

[lib]
name = "aria_agent_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = "0.28"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
# Local HTTP stubs for the cloud backend (no real network in tests).
wiremock = "0.6"
tempfile = "3"
