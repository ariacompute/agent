[package]
name = "ariacompute-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI FFI surface for the agent platform (Swift / Kotlin bindings)."

[lib]
name = "aria_agent_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = "0.28"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures = "0.3"
aria-agent-core = { workspace = true, features = ["openai"] }
aria-agent-memo.workspace = true

[features]
default = ["openai"]
# Wire real OpenAI calls in the SDK agent runtime.
openai = ["aria-agent-core/openai"]
