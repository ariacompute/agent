[package]
name = "agent-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Cross-crate integration tests (memo / sandbox / core / cloud contract)."

[lib]
path = "src/lib.rs"

[[test]]
name = "integration"
path = "integration.rs"

[[test]]
name = "e2e_http"
path = "e2e_http.rs"

[dev-dependencies]
aria-agent-memo.workspace = true
aria-agent-sandbox.workspace = true
aria-agent-core.workspace = true
aria-agent-orchestrator.workspace = true
aria-agent-cloud = { path = "../crates/aria-agent-cloud" }
uuid.workspace = true
tokio.workspace = true
serde_json.workspace = true
async-trait.workspace = true
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
