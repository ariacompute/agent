[workspace]
resolver = "2"
members = [
    "crates/aria-agent-plugin",
    "crates/aria-agent-governance",
    "crates/aria-agent-egress-proxy",
    "crates/aria-agent-memo",
    "crates/aria-agent-sandbox",
    "crates/aria-agent-core",
    "crates/aria-agent-dsh",
    "crates/aria-agent-tools",
    "crates/aria-agent-orchestrator",
    "crates/aria-agent-rsi",
    "crates/aria-agent-browser",
    "crates/ariacompute-agent",
    "crates/aria-agent-cloud",
    "crates/aria-agent-ffigen",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cross-cutting crates (path deps within this workspace)
aria-agent-plugin = { path = "crates/aria-agent-plugin", version = "0.1.0" }
aria-agent-memo = { path = "crates/aria-agent-memo" }
aria-agent-sandbox = { path = "crates/aria-agent-sandbox" }
aria-agent-core = { path = "crates/aria-agent-core" }
aria-agent-tools = { path = "crates/aria-agent-tools", version = "0.1.0" }
aria-agent-orchestrator = { path = "crates/aria-agent-orchestrator" }
aria-agent-rsi = { path = "crates/aria-agent-rsi" }
aria-agent-browser = { path = "crates/aria-agent-browser", version = "0.1.0" }

[profile.release]
opt-level = 2
