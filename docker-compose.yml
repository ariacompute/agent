# Agent Cloud — docker-compose deployment.
#
# Services:
#   postgres  Postgres + pgvector (metadata: agents / runs; context:
#             context_fragments). Schema is created on boot by the cloud service
#             (ensure_schema), so no init scripts are needed.
#   cloud     The `aria-agent` axum service. Waits for a healthy Postgres. Mounts
#             the host Docker socket so the Docker sandbox can spawn tool-exec
#             containers via the Engine API (no `docker` CLI inside the image).
#             This mirrors the playground's DooD model: the socket is mounted
#             and reached through `DOCKER_HOST` (default unix socket).
#   nginx     Reverse proxy in front of `cloud` (see nginx/default.conf).
#
# All configuration lives in a local `.env` file (see `.env.example`). Copy it
# first, then adjust values:   cp .env.example .env
# Compose auto-loads `.env` for variable substitution (e.g. ${CLOUD_PORT}) and
# the `cloud` service also reads it via `env_file` so the container process gets
# every variable directly.
#
# Build & run — two equivalent flows (the `cloud` service keeps `image:
# aria-agent-cloud`, so both share the same image name):
#
#   A) Build manually, then `up` (reuses the pre-built image):
#        docker build --network=host \
#          --build-arg BUILD_PROXY=http://127.0.0.1:7897 \
#          --build-arg DOCKER_GID=998 \
#          -f Dockerfile -t aria-agent-cloud .
#        docker compose up
#
#   B) Let compose build + run in one shot:
#        export BUILD_PROXY=http://127.0.0.1:7897   # optional; empty = direct
#        export DOCKER_GID=998
#        docker compose up --build
#
# `BUILD_PROXY` / `DOCKER_GID` are passed as build args (see the `cloud` service
# `build:` block) and may come from the shell environment or the `.env` file.
# `BUILD_PROXY` is empty by default => the build uses a direct internet
# connection. `network: host` (Linux only) lets the build container reach a
# host-side proxy on 127.0.0.1.
#
# Then (pick one entrypoint):
#   * Direct:        POST http://localhost:3000/v1/agents  (CLOUD_PORT)
#   * Via nginx:     POST http://localhost:80/v1/agents     (NGINX_PORT)

services:
  postgres:
    # pgvector is a hard requirement: the context store (`context_fragments`)
    # stores embeddings in a `vector(256)` column and refuses to start if the
    # `vector` extension is unavailable.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloud:
    image: aria-agent-cloud
    # Build the image with the same args as a manual `docker build`. `network:
    # host` lets the build container reach a host-side proxy on 127.0.0.1 (e.g.
    # Clash on 127.0.0.1:7897); `BUILD_PROXY` (via env / .env) is empty => direct
    # internet. Keeping `image:` means `docker compose up` (no --build) reuses a
    # pre-built `aria-agent-cloud` image, while `docker compose up --build`
    # rebuilds it. On Mac/Windows Docker Desktop, build host networking is
    # unsupported — instead listen the proxy on 0.0.0.0 or drop `network: host`.
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        BUILD_PROXY: ${BUILD_PROXY:-}
        DOCKER_GID: ${DOCKER_GID:-998}
    depends_on:
      postgres:
        condition: service_healthy
    # Load every variable from the local `.env` into the container process.
    env_file:
      - .env
    environment:
      # Docker Engine endpoint for the sandbox. Defaults to the mounted host
      # socket (DooD). Override with a remote daemon if preferred. Honored by
      # the bollard-based Docker sandbox.
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    # Host Docker socket so the Docker sandbox can run tool containers. Safe only
    # when you trust the composed service. To disable sandboxing, comment this
    # line out (and the `DOCKER_GID` build arg is then unused).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Direct access to the cloud API (debug / when nginx is not needed).
    ports:
      - "${CLOUD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      cloud:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # Reverse-proxy config: forwards everything to the `cloud` service.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
