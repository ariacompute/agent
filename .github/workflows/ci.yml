name: CI

# Test, SDK, FFI and coverage gates for the agent workspace.
#
# `test` runs the whole workspace suite on Linux and Windows. `e2e` drives the
# real-socket HTTP suite; its Postgres/Docker scenarios skip with a reason when
# their dependencies are absent. `sdk` runs the JS and Python SDK suites;
# `ffi-drift` regenerates the committed bindings. `coverage` re-runs the suite
# under `cargo-llvm-cov` and fails unless every included source line is
# executed — see `scripts/coverage.sh` and `docs/coverage.md` for the exclusion
# list.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  e2e:
    name: HTTP E2E (real socket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Real-socket HTTP E2E
        # Same command as `just e2e`. DATABASE_URL / ARIA_E2E_DOCKER are not
        # configured here, so those optional scenarios skip with a reason.
        run: cargo test -p agent-tests --test e2e_http -- --nocapture

  sdk:
    name: SDK tests (JS + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: JS SDK tests
        working-directory: sdk/js
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Python SDK tests
        working-directory: sdk/python
        run: python3 -m unittest discover -s tests

  ffi-drift:
    name: FFI bindings drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate Swift/Kotlin bindings
        run: |
          cargo build -p ariacompute-agent
          cargo run -p aria-agent-ffigen

      - name: Assert no binding drift
        run: |
          git diff --exit-code -- bindings/
          test -z "$(git status --porcelain -- bindings/)"

  coverage:
    name: coverage gate (no uncovered lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: coverage
        run: ./scripts/coverage.sh

      - name: upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  postgres:
    name: Postgres backends (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by `context/pg.rs` (`CREATE EXTENSION vector`).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # These tests early-return without DATABASE_URL, so the job that proves
      # the pg backends work is the one that sets it. A silent skip is not a
      # pass: the run below must report the DB tests as *passed*.
      - name: cargo test (DATABASE_URL set)
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aria
        run: cargo test -p aria-agent-cloud --lib -- --nocapture

      # The real-socket suite has the same gate: the Postgres scenario skips
      # without DATABASE_URL, so it belongs in the job that has one.
      - name: real-socket E2E with Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aria
        run: cargo test -p agent-tests --test e2e_http -- --nocapture
