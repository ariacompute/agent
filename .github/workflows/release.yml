name: Release

on:
  release:
    types:
      - created

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: aria-agent

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset_os: linux_x86_64
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            asset_os: windows_x86_64
            archive: zip
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset_os: linux_arm64
            archive: tar.gz
          - name: macos
            os: macos-latest
            asset_os: macos
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release binary
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Embed release tag (sans leading v) into aria-agent -v/--version.
          export ARIA_AGENT_VERSION="${TAG_NAME#v}"
          echo "ARIA_AGENT_VERSION=$ARIA_AGENT_VERSION"
          cargo build --release -p aria-agent-cloud
          cargo build --release -p ariacompute-agent

      - name: Rename FFI cdylib to published name
        shell: bash
        run: |
          set -euo pipefail
          # Rust lib target names cannot contain hyphens, so cargo emits the
          # cdylib/static lib as libaria_agent_ffi.* / aria_agent_ffi.dll. Publish
          # it under the aria-agent_ffi label by copying to hyphenated names.
          cd target/release
          ren() { [ -f "$1" ] && cp "$1" "$2"; }
          ren libaria_agent_ffi.so      libaria-agent_ffi.so
          ren libaria_agent_ffi.dylib   libaria-agent_ffi.dylib
          ren libaria_agent_ffi.a       libaria-agent_ffi.a
          ren aria_agent_ffi.dll         aria-agent_ffi.dll
          ren aria_agent_ffi.dll.lib     aria-agent_ffi.dll.lib
          ren aria_agent_ffi.lib         aria-agent_ffi.lib
          cd ../..

      - name: Package release archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="aria-agent_${VERSION}_${ASSET_OS}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C target/release "$BIN_NAME"
          echo "ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $archiveName = "aria-agent_${version}_$($env:ASSET_OS).zip"
          Compress-Archive -Path "target/release/$($env:BIN_NAME).exe" -DestinationPath $archiveName -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=$archiveName"

      - name: Package libaria-agent_ffi (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="libaria-agent_ffi_${VERSION}_${ASSET_OS}.tar.gz"
          cd target/release
          if [[ -f libaria-agent_ffi.dylib ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria-agent_ffi.dylib
          elif [[ -f libaria-agent_ffi.so ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria-agent_ffi.so
          elif [[ -f libaria-agent_ffi.a ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria-agent_ffi.a
          else
            echo "No libaria-agent_ffi shared/static library found in target/release" >&2
            ls -la
            exit 1
          fi
          cd ../..
          echo "FFI_ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package libaria-agent_ffi (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="libaria-agent_ffi_${VERSION}_${ASSET_OS}.tar.gz"
          cd target/release
          if [[ -f aria-agent_ffi.dll ]]; then
            FILES=(aria-agent_ffi.dll)
            if [[ -f aria-agent_ffi.dll.lib ]]; then
              cp aria-agent_ffi.dll.lib aria-agent_ffi.dll.lib
              FILES+=(aria-agent_ffi.dll.lib)
            fi
            if [[ -f aria-agent_ffi.lib ]]; then
              cp aria-agent_ffi.lib aria-agent_ffi.lib
              FILES+=(aria-agent_ffi.lib)
            fi
            tar -czf "../../$ARCHIVE_NAME" "${FILES[@]}"
          else
            echo "No aria-agent_ffi.dll found in target/release" >&2
            ls -la
            exit 1
          fi
          cd ../..
          echo "FFI_ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.FFI_ASSET_PATH }}
          token: ${{ secrets.ARIACOMPUTE_TOKEN }}

  # Language package publishes are fail-pass: must not block CLI/assets.
  publish-packages:
    name: Publish language packages (fail-pass)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"
      - name: crates.io ariacompute-agent (+ deps)
        run: |
          echo "crates.io publish handled by publish-cargo.yml (ariacompute-agent + deps)"
          echo "crates.io publish stub"
      - name: CocoaPods Swift AriaAgent
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          echo "Configure COCOAPODS_TRUNK_TOKEN then: pod trunk push bindings/swift/AriaAgent.podspec"
          echo "CocoaPods publish stub (fail-pass)"
      - name: Maven Central com.ariacompute:agent (Android AAR)
        run: |
          echo "Maven publish handled by publish-maven.yml (vanniktech plugin -> Central Portal)"
          echo "Maven publish stub"
